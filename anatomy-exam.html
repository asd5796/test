<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>解剖學 期中全真模擬題庫 (100題・高鑑別度)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #991b1b; /* 深紅解剖醫學主色 */
      --primary-light: #ef4444;
      --primary-dark: #7f1d1d;
      --primary-bg: #fef2f2;
      --secondary: #0f766e;
      --secondary-bg: #f0fdfa;
      --accent: #d97706;
      --accent-bg: #fffbeb;
      --success: #15803d;
      --success-bg: #f0fdf4;
      --error: #b91c1c;
      --error-bg: #fef2f2;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --radius: 12px;
      --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.07), 0 2px 4px -2px rgb(0 0 0 / 0.05);
      --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.08), 0 4px 6px -4px rgb(0 0 0 / 0.04);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Noto Sans TC', system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding-bottom: 3rem;
      min-height: 100vh;
    }

    header {
      background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 100%);
      color: white;
      padding: 1.25rem 1rem;
      box-shadow: 0 4px 12px rgba(127, 29, 29, 0.25);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav-container {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .site-title {
      font-family: 'Noto Serif TC', serif;
      font-size: 1.25rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      letter-spacing: 0.02em;
    }

    .nav-actions {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    .nav-btn {
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: white;
      padding: 0.4rem 0.8rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      transition: all 0.2s;
      text-decoration: none;
    }

    .nav-btn:hover {
      background: rgba(255, 255, 255, 0.25);
    }

    main {
      max-width: 1100px;
      margin: 1.5rem auto;
      padding: 0 1rem;
      display: grid;
      grid-template-columns: 1fr 300px;
      gap: 1.5rem;
      align-items: start;
    }

    @media (max-width: 900px) {
      main {
        grid-template-columns: 1fr;
      }
    }

    /* Filters Card */
    .filter-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem;
      margin-bottom: 1rem;
      box-shadow: var(--shadow);
    }

    .filter-tabs {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
      margin-bottom: 0.8rem;
    }

    .tab-btn {
      background: #f1f5f9;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 0.4rem 0.75rem;
      border-radius: 6px;
      font-size: 0.825rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn:hover {
      background: #e2e8f0;
      color: var(--text);
    }

    .tab-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: white;
      font-weight: 700;
    }

    .tab-btn.star-tab.active {
      background: var(--accent);
      border-color: var(--accent);
    }

    .tab-btn.wrong-tab.active {
      background: var(--error);
      border-color: var(--error);
    }

    .stats-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      color: var(--text-muted);
      border-top: 1px solid var(--border);
      padding-top: 0.75rem;
    }

    .stat-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      font-weight: 600;
    }

    .stat-badge.score { color: var(--success); }
    .stat-badge.wrong { color: var(--error); }
    .stat-badge.star { color: var(--accent); }

    /* Progress bar */
    .progress-track {
      width: 100%;
      height: 6px;
      background: #e2e8f0;
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 1rem;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary) 0%, var(--primary-light) 100%);
      width: 0%;
      transition: width 0.3s ease;
    }

    /* Quiz Card */
    .quiz-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
      box-shadow: var(--shadow);
    }

    .question-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }

    .header-badges {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .category-pill {
      background: var(--secondary-bg);
      color: var(--secondary);
      border: 1px solid rgba(15, 118, 110, 0.2);
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
    }

    .exam-star-pill {
      background: var(--accent-bg);
      color: var(--accent);
      border: 1px solid rgba(217, 119, 6, 0.25);
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
    }

    .q-number {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .bookmark-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1.25rem;
      color: #cbd5e1;
      transition: all 0.2s;
      padding: 0.2rem;
    }

    .bookmark-btn:hover {
      transform: scale(1.15);
      color: var(--accent);
    }

    .bookmark-btn.bookmarked {
      color: var(--accent);
    }

    .question-text {
      font-size: 1.1rem;
      font-weight: 600;
      line-height: 1.6;
      margin-bottom: 1.5rem;
      color: #0f172a;
    }

    /* Options */
    .options-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }

    .option-btn {
      background: #ffffff;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 0.85rem 1rem;
      text-align: left;
      font-size: 0.95rem;
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      width: 100%;
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--primary-light);
      background: #fdf2f2;
      transform: translateY(-1px);
    }

    .option-prefix {
      font-weight: 700;
      color: var(--text-muted);
      flex-shrink: 0;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
    }

    .option-btn.correct {
      border-color: var(--success) !important;
      background: var(--success-bg) !important;
      color: var(--success) !important;
      font-weight: 600;
    }

    .option-btn.correct .option-prefix {
      background: var(--success);
      color: white;
    }

    .option-btn.wrong {
      border-color: var(--error) !important;
      background: var(--error-bg) !important;
      color: var(--error) !important;
    }

    .option-btn.wrong .option-prefix {
      background: var(--error);
      color: white;
    }

    /* Explanation Box */
    .explanation-box {
      display: none;
      border-radius: 10px;
      padding: 1.25rem;
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      margin-top: 1rem;
      animation: fadeIn 0.3s ease;
    }

    .explanation-box.active {
      display: block;
    }

    .explanation-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.6rem;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .result-badge {
      font-weight: 700;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    .source-badge {
      background: #ede9fe;
      color: #6d28d9;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.2rem 0.5rem;
      border-radius: 6px;
      border: 1px solid #ddd6fe;
    }

    .explanation-text {
      font-size: 0.925rem;
      line-height: 1.65;
      color: #334155;
      margin-bottom: 0.8rem;
    }

    .copy-report-btn {
      background: white;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 0.35rem 0.75rem;
      border-radius: 6px;
      font-size: 0.75rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      transition: all 0.2s;
    }

    .copy-report-btn:hover {
      background: #f1f5f9;
      color: var(--text);
      border-color: #94a3b8;
    }

    /* Card Footer Navigation */
    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 1.5rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
    }

    .btn {
      padding: 0.6rem 1.25rem;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.2s;
      border: none;
    }

    .btn-secondary {
      background: #f1f5f9;
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover:not(:disabled) {
      background: #e2e8f0;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--primary-dark);
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* Navigator Sidebar */
    .sidebar {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem;
      box-shadow: var(--shadow);
      position: sticky;
      top: 5rem;
      max-height: calc(100vh - 6.5rem);
      overflow-y: auto;
    }

    .sidebar-header {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 0.75rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .legend {
      display: flex;
      gap: 0.5rem;
      font-size: 0.725rem;
      color: var(--text-muted);
      margin-bottom: 0.75rem;
      flex-wrap: wrap;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 0.25rem;
    }

    .legend-dot {
      width: 8px;
      height: 8px;
      border-radius: 2px;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 0.35rem;
    }

    .grid-btn {
      aspect-ratio: 1;
      border: 1px solid var(--border);
      background: #f8fafc;
      color: var(--text-muted);
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
      position: relative;
    }

    .grid-btn:hover {
      border-color: var(--primary-light);
      transform: scale(1.05);
    }

    .grid-btn.current {
      outline: 2px solid var(--primary);
      outline-offset: 1px;
      font-weight: 700;
    }

    .grid-btn.correct {
      background: var(--success);
      color: white;
      border-color: var(--success);
    }

    .grid-btn.wrong {
      background: var(--error);
      color: white;
      border-color: var(--error);
    }

    .grid-btn.bookmarked::after {
      content: '★';
      position: absolute;
      top: -3px;
      right: 0px;
      font-size: 0.65rem;
      color: var(--accent);
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      background: #1e293b;
      color: white;
      padding: 0.75rem 1.25rem;
      border-radius: 8px;
      font-size: 0.85rem;
      box-shadow: var(--shadow-lg);
      display: none;
      animation: slideUp 0.3s ease;
      z-index: 1000;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <header>
    <div class="nav-container">
      <div class="site-title">
        <span>🫀</span>
        <span>解剖學期中全真模擬題庫 (100題・高鑑別度)</span>
      </div>
      <div class="nav-actions">
        <a href="index.html" class="nav-btn">
          <span>🏠</span>
          <span>首頁</span>
        </a>
        <button id="shuffleBtn" class="nav-btn" onclick="toggleShuffle()">
          <span>🔀</span>
          <span id="shuffleText">隨機: 關</span>
        </button>
        <button class="nav-btn" onclick="clearProgress()">
          <span>🔄</span>
          <span>重設進度</span>
        </button>
      </div>
    </div>
  </header>

  <main>
    <div class="left-col">
      <!-- Filter Card -->
      <div class="filter-card">
        <div class="filter-tabs" id="filterTabs">
          <button class="tab-btn active" onclick="setFilter('all', this)">全部 100 題</button>
          <button class="tab-btn star-tab" onclick="setFilter('star', this)">🔥 必考星號題</button>
          <button class="tab-btn wrong-tab" onclick="setFilter('wrong', this)">錯題重練 (<span id="wrongCountLabel">0</span>)</button>
          <button class="tab-btn" onclick="setFilter('bookmarked', this)">⭐ 收藏題 (<span id="bookmarkCountLabel">0</span>)</button>
          <button class="tab-btn" onclick="setFilter('ch1', this)">Ch1 細胞與上皮 (15題)</button>
          <button class="tab-btn" onclick="setFilter('ch2', this)">Ch2 胚胎與皮膚 (15題)</button>
          <button class="tab-btn" onclick="setFilter('ch3', this)">Ch3 骨骼與骨盆 (18題)</button>
          <button class="tab-btn" onclick="setFilter('ch4', this)">Ch4 關節與滑液 (18題)</button>
          <button class="tab-btn" onclick="setFilter('ch5', this)">Ch5 肌肉與作功 (18題)</button>
          <button class="tab-btn" onclick="setFilter('ch6', this)">Ch6 心血管與循環 (16題)</button>
        </div>
        <div class="stats-bar">
          <div>
            <span class="stat-badge score">答對: <span id="correctScore">0</span></span>
            <span class="stat-badge wrong" style="margin-left: 0.75rem;">答錯: <span id="wrongScore">0</span></span>
            <span class="stat-badge star" style="margin-left: 0.75rem;">收藏: <span id="bookmarkScore">0</span></span>
          </div>
          <div>
            <span id="progressText">1 / 100</span>
          </div>
        </div>
      </div>

      <!-- Progress Track -->
      <div class="progress-track">
        <div class="progress-fill" id="progressBar"></div>
      </div>

      <!-- Active Quiz Card -->
      <div class="quiz-card" id="quizCard">
        <div class="question-header">
          <div class="header-badges">
            <span class="category-pill" id="chapterPill">章節</span>
            <span class="exam-star-pill" id="examStarPill" style="display: none;">🔥 必考考點</span>
          </div>
          <div style="display: flex; align-items: center; gap: 0.5rem;">
            <span class="q-number" id="questionNumber">第 1 / 100 題</span>
            <button class="bookmark-btn" id="bookmarkBtn" onclick="toggleBookmark()" title="收藏本題">★</button>
          </div>
        </div>

        <div class="question-text" id="questionStem">載入題目中...</div>

        <!-- Options -->
        <div class="options-list" id="optionsList"></div>

        <!-- Explanation Box -->
        <div class="explanation-box" id="explanationBox">
          <div class="explanation-header">
            <span class="result-badge" id="resultBadge">💡 核心解析</span>
            <span class="source-badge" id="sourceBadge">出處載入中</span>
          </div>
          <div class="explanation-text" id="explanationText"></div>
          <button class="copy-report-btn" onclick="copyQuestionReport()">
            <span>📋</span>
            <span>複製本題資訊以供修正 / 筆記</span>
          </button>
        </div>

        <!-- Footer Navigation -->
        <div class="card-footer">
          <button class="btn btn-secondary" id="prevBtn" onclick="prevQuestion()" disabled>
            <span>⬅</span>
            <span>上一題</span>
          </button>
          <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()">
            <span>下一題</span>
            <span>➡</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Right Sidebar Navigator -->
    <div class="sidebar">
      <div class="sidebar-header">
        <span>題號導覽 (1~100)</span>
        <span style="font-size: 0.75rem; color: var(--text-muted);" id="navStats">0/100</span>
      </div>
      <div class="legend">
        <div class="legend-item"><span class="legend-dot" style="background:#e2e8f0;"></span> 未答</div>
        <div class="legend-item"><span class="legend-dot" style="background:var(--success);"></span> 答對</div>
        <div class="legend-item"><span class="legend-dot" style="background:var(--error);"></span> 答錯</div>
      </div>
      <div class="grid-container" id="gridContainer"></div>
    </div>
  </main>

  <div class="toast" id="toast">已複製至剪貼簿！</div>

  <script>

      "B. 「半月瓣（Semilunar valves：主動脈瓣與肺動脈瓣）驟然關閉」及大動脈壁彈性回縮振動所發出；標誌「心室舒張期（Ventricular diastole）的開始」；聲音較清脆短促；在「心底部（胸骨左、右緣第 2 肋間）」聽診最清楚",
      "C. 下腔靜脈瓣關閉；標誌心房收縮期；劍突處聽診",
      "D. 浦肯野纖維釋放動作電位時的電磁聲響；胸骨角聽診"
    ],
    "answer": 1,
    "explanation": "正確答案為 B。第二心音（S2 / 第二聲 'Dubb'）核心考點對比：\n1. 產生機轉：心室收縮完畢開始舒張，心室內壓驟降低於大動脈壓，主動脈與肺動脈內的逆流血流迫使「半月瓣（Semilunar valves：主動脈瓣 Aortic valve、肺動脈瓣 Pulmonary valve）驟然閉合」引發動脈壁振動；\n2. 週期意義：標誌著「心室舒張期（Ventricular diastole）」的正式開始；\n3. 聲音特點：頻率較高、聲音較清脆而短促（約 0.11 秒）；\n4. 聽診部位：在「心底部（Base of heart）」，即胸骨右緣第 2 肋間（主動脈瓣聽診區）與胸骨左緣第 2 肋間（肺動脈瓣聽診區）聽診最為清楚。故選 B。",
    "source": "大仁解剖學 Chap 18-4 P.25 (🔥考點二十二：靜脈回流四大機制與心音成因)"
  }
];

  </script>

  <!-- Inlined Application Logic -->
  <script>
// Anatomy Exam App Logic
(function() {
  let allQuestions = [];
  let activeQuestions = [];
  let currentIndex = 0;
  let isShuffle = false;

  // LocalStorage keys
  const STORAGE_ANSWERS = 'anatomy_quiz_answers_v1';
  const STORAGE_WRONGS = 'anatomy_quiz_wrongs_v1';
  const STORAGE_BOOKMARKS = 'anatomy_quiz_bookmarks_v1';

  let userAnswers = {};
  let wrongIds = new Set();
  let bookmarkIds = new Set();
  let currentFilter = 'all';

  // DOM Elements
  const qStem = document.getElementById('questionStem');
  const qChapter = document.getElementById('chapterPill');
  const qExamStar = document.getElementById('examStarPill');
  const qNum = document.getElementById('questionNumber');
  const qBookmark = document.getElementById('bookmarkBtn');
  const optsList = document.getElementById('optionsList');
  const expBox = document.getElementById('explanationBox');
  const resBadge = document.getElementById('resultBadge');
  const srcBadge = document.getElementById('sourceBadge');
  const expText = document.getElementById('explanationText');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const pBar = document.getElementById('progressBar');
  const pText = document.getElementById('progressText');
  const gridContainer = document.getElementById('gridContainer');
  const navStats = document.getElementById('navStats');
  const correctScore = document.getElementById('correctScore');
  const wrongScore = document.getElementById('wrongScore');
  const bookmarkScore = document.getElementById('bookmarkScore');
  const wrongCountLabel = document.getElementById('wrongCountLabel');
  const bookmarkCountLabel = document.getElementById('bookmarkCountLabel');
  const toast = document.getElementById('toast');
  const shuffleText = document.getElementById('shuffleText');

  function loadStorage() {
    try {
      const a = localStorage.getItem(STORAGE_ANSWERS);
      if (a) userAnswers = JSON.parse(a);
      const w = localStorage.getItem(STORAGE_WRONGS);
      if (w) wrongIds = new Set(JSON.parse(w));
      const b = localStorage.getItem(STORAGE_BOOKMARKS);
      if (b) bookmarkIds = new Set(JSON.parse(b));
    } catch(e) {
      console.warn('Storage read error:', e);
    }
  }

  function saveStorage() {
    try {
      localStorage.setItem(STORAGE_ANSWERS, JSON.stringify(userAnswers));
      localStorage.setItem(STORAGE_WRONGS, JSON.stringify(Array.from(wrongIds)));
      localStorage.setItem(STORAGE_BOOKMARKS, JSON.stringify(Array.from(bookmarkIds)));
    } catch(e) {
      console.warn('Storage save error:', e);
    }
  }

  window.clearProgress = function() {
    if (confirm('確定要清除所有已作答與錯題紀錄嗎？此動作無法復原。')) {
      userAnswers = {};
      wrongIds = new Set();
      bookmarkIds = new Set();
      saveStorage();
      renderGrid();
      updateStats();
      renderQuestion();
      showToast('作答紀錄已全部清除！');
    }
  };

  window.toggleShuffle = function() {
    isShuffle = !isShuffle;
    shuffleText.textContent = isShuffle ? '隨機: 開' : '隨機: 關';
    if (isShuffle) {
      shuffleArray(activeQuestions);
    } else {
      reapplyFilterOrder();
    }
    currentIndex = 0;
    renderQuestion();
    renderGrid();
  };

  function shuffleArray(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
  }

  function reapplyFilterOrder() {
    const activeIds = new Set(activeQuestions.map(q => q.id));
    activeQuestions = allQuestions.filter(q => activeIds.has(q.id));
  }

  window.setFilter = function(filterType, btnElem) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    if (btnElem) btnElem.classList.add('active');
    currentFilter = filterType;

    if (filterType === 'all') {
      activeQuestions = [...allQuestions];
    } else if (filterType === 'star') {
      activeQuestions = allQuestions.filter(q => q.isExamStar);
    } else if (filterType === 'wrong') {
      activeQuestions = allQuestions.filter(q => wrongIds.has(q.id));
      if (activeQuestions.length === 0) {
        alert('目前尚無錯題！答錯的題目會自動記錄於此。');
        setFilter('all', document.querySelectorAll('.tab-btn')[0]);
        return;
      }
    } else if (filterType === 'bookmarked') {
      activeQuestions = allQuestions.filter(q => bookmarkIds.has(q.id));
      if (activeQuestions.length === 0) {
        alert('目前尚無收藏題目！點擊題號右上角星號 ★ 即可加入收藏。');
        setFilter('all', document.querySelectorAll('.tab-btn')[0]);
        return;
      }
    } else if (filterType === 'ch1') {
      activeQuestions = allQuestions.filter(q => q.id >= 1 && q.id <= 15);
    } else if (filterType === 'ch2') {
      activeQuestions = allQuestions.filter(q => q.id >= 16 && q.id <= 30);
    } else if (filterType === 'ch3') {
      activeQuestions = allQuestions.filter(q => q.id >= 31 && q.id <= 48);
    } else if (filterType === 'ch4') {
      activeQuestions = allQuestions.filter(q => q.id >= 49 && q.id <= 66);
    } else if (filterType === 'ch5') {
      activeQuestions = allQuestions.filter(q => q.id >= 67 && q.id <= 84);
    } else if (filterType === 'ch6') {
      activeQuestions = allQuestions.filter(q => q.id >= 85 && q.id <= 100);
    }

    if (isShuffle) {
      shuffleArray(activeQuestions);
    }

    currentIndex = 0;
    renderQuestion();
    renderGrid();
  };

  window.toggleBookmark = function() {
    const q = activeQuestions[currentIndex];
    if (!q) return;
    if (bookmarkIds.has(q.id)) {
      bookmarkIds.delete(q.id);
      qBookmark.classList.remove('bookmarked');
      showToast(`已取消收藏第 ${q.id} 題`);
    } else {
      bookmarkIds.add(q.id);
      qBookmark.classList.add('bookmarked');
      showToast(`已收藏第 ${q.id} 題！`);
    }
    saveStorage();
    updateStats();
    renderGrid();
  };

  function renderQuestion() {
    if (!activeQuestions.length) return;
    const q = activeQuestions[currentIndex];

    qStem.textContent = q.question;
    qChapter.textContent = q.chapter || '解剖學核心';
    qExamStar.style.display = q.isExamStar ? 'inline-flex' : 'none';
    qNum.textContent = `第 ${currentIndex + 1} / ${activeQuestions.length} 題 (題號 #${q.id})`;
    pText.textContent = `${currentIndex + 1} / ${activeQuestions.length}`;
    pBar.style.width = `${((currentIndex + 1) / activeQuestions.length) * 100}%`;

    // Bookmark icon state
    if (bookmarkIds.has(q.id)) {
      qBookmark.classList.add('bookmarked');
    } else {
      qBookmark.classList.remove('bookmarked');
    }

    // Options rendering
    optsList.innerHTML = '';
    const answered = userAnswers.hasOwnProperty(q.id);
    const chosenIdx = userAnswers[q.id];

    q.options.forEach((optText, idx) => {
      const btn = document.createElement('button');
      btn.className = 'option-btn';

      // Prefix A, B, C, D
      const prefix = ['A', 'B', 'C', 'D'][idx];
      let cleanText = optText;
      if (cleanText.startsWith(`${prefix}.`)) {
        cleanText = cleanText.substring(2).trim();
      }

      btn.innerHTML = `<span class="option-prefix">${prefix}</span><span>${cleanText}</span>`;

      if (answered) {
        btn.disabled = true;
        if (idx === q.answer) {
          btn.classList.add('correct');
        } else if (idx === chosenIdx) {
          btn.classList.add('wrong');
        }
      } else {
        btn.onclick = () => selectOption(idx);
      }

      optsList.appendChild(btn);
    });

    // Explanation Box
    if (answered) {
      expBox.classList.add('active');
      const isRight = chosenIdx === q.answer;
      resBadge.textContent = isRight ? '✅ 回答正確！核心考點解析：' : '❌ 回答錯誤！核心考點解析：';
      resBadge.style.color = isRight ? 'var(--success)' : 'var(--error)';
      srcBadge.textContent = q.source || '解剖學講義出處';
      expText.textContent = q.explanation;
    } else {
      expBox.classList.remove('active');
    }

    prevBtn.disabled = currentIndex === 0;
    nextBtn.textContent = (currentIndex === activeQuestions.length - 1) ? '測驗結尾 🏁' : '下一題 ➡';

    renderGridHighlight();
  }

  function selectOption(selectedIdx) {
    const q = activeQuestions[currentIndex];
    if (userAnswers.hasOwnProperty(q.id)) return;

    userAnswers[q.id] = selectedIdx;
    if (selectedIdx !== q.answer) {
      wrongIds.add(q.id);
    } else {
      wrongIds.delete(q.id);
    }

    saveStorage();
    updateStats();
    renderQuestion();
    renderGrid();
  }

  window.prevQuestion = function() {
    if (currentIndex > 0) {
      currentIndex--;
      renderQuestion();
    }
  };

  window.nextQuestion = function() {
    if (currentIndex < activeQuestions.length - 1) {
      currentIndex++;
      renderQuestion();
    }
  };

  window.jumpToQuestion = function(qid) {
    const idx = activeQuestions.findIndex(q => q.id === qid);
    if (idx !== -1) {
      currentIndex = idx;
      renderQuestion();
    } else {
      // If question is not in current filter, switch to 'all'
      setFilter('all', document.querySelectorAll('.tab-btn')[0]);
      currentIndex = allQuestions.findIndex(q => q.id === qid);
      renderQuestion();
    }
  };

  function renderGrid() {
    gridContainer.innerHTML = '';
    allQuestions.forEach((q) => {
      const btn = document.createElement('button');
      btn.className = 'grid-btn';
      btn.textContent = q.id;
      btn.id = `grid-btn-${q.id}`;

      if (userAnswers.hasOwnProperty(q.id)) {
        if (userAnswers[q.id] === q.answer) {
          btn.classList.add('correct');
        } else {
          btn.classList.add('wrong');
        }
      }

      if (bookmarkIds.has(q.id)) {
        btn.classList.add('bookmarked');
      }

      btn.onclick = () => jumpToQuestion(q.id);
      gridContainer.appendChild(btn);
    });

    renderGridHighlight();
  }

  function renderGridHighlight() {
    document.querySelectorAll('.grid-btn').forEach(b => b.classList.remove('current'));
    if (activeQuestions.length && activeQuestions[currentIndex]) {
      const currId = activeQuestions[currentIndex].id;
      const target = document.getElementById(`grid-btn-${currId}`);
      if (target) {
        target.classList.add('current');
      }
    }
  }

  function updateStats() {
    let correct = 0;
    let wrong = 0;
    Object.keys(userAnswers).forEach(id => {
      const q = allQuestions.find(x => x.id === parseInt(id));
      if (q) {
        if (userAnswers[id] === q.answer) correct++;
        else wrong++;
      }
    });

    correctScore.textContent = correct;
    wrongScore.textContent = wrong;
    bookmarkScore.textContent = bookmarkIds.size;
    wrongCountLabel.textContent = wrongIds.size;
    bookmarkCountLabel.textContent = bookmarkIds.size;
    navStats.textContent = `${Object.keys(userAnswers).length}/100`;
  }

  window.copyQuestionReport = function() {
    const q = activeQuestions[currentIndex];
    if (!q) return;

    const prefix = ['A', 'B', 'C', 'D'];
    const optLines = q.options.map(opt => `  ${opt}`).join('\n');
    const reportText = `【題目勘誤回報】\n題號: #${q.id}\n章節: ${q.chapter}\n星號考點: ${q.isExamStar ? '是' : '否'}\n出處: ${q.source}\n題目: ${q.question}\n選項:\n${optLines}\n正確答案: ${prefix[q.answer]}\n解析: ${q.explanation}`;

    navigator.clipboard.writeText(reportText).then(() => {
      showToast('📋 已複製本題詳細資訊至剪貼簿！');
    }).catch(() => {
      showToast('複製失敗，請手動選取文字');
    });
  };

  function showToast(msg) {
    toast.textContent = msg;
    toast.style.display = 'block';
    setTimeout(() => {
      toast.style.display = 'none';
    }, 2200);
  }

  // Keyboard navigation
  document.addEventListener('keydown', (e) => {
    if (!activeQuestions.length) return;
    const q = activeQuestions[currentIndex];
    const answered = userAnswers.hasOwnProperty(q.id);

    if (!answered) {
      if (e.key === '1' || e.key === 'a' || e.key === 'A') selectOption(0);
      else if (e.key === '2' || e.key === 'b' || e.key === 'B') selectOption(1);
      else if (e.key === '3' || e.key === 'c' || e.key === 'C') selectOption(2);
      else if (e.key === '4' || e.key === 'd' || e.key === 'D') selectOption(3);
    } else {
      if (e.key === 'ArrowRight' || e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        nextQuestion();
      } else if (e.key === 'ArrowLeft') {
        prevQuestion();
      }
    }
  });

  // App Init
  function init() {
    if (window.QUIZ_DATA && Array.isArray(window.QUIZ_DATA)) {
      allQuestions = [...window.QUIZ_DATA];
    } else {
      allQuestions = [];
    }

    loadStorage();
    activeQuestions = [...allQuestions];
    renderGrid();
    updateStats();
    renderQuestion();
  }

  window.onload = init;
})();

  </script>
