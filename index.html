<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>常見藥用植物科名 測驗</title>
    <!-- 使用 Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen text-gray-800 font-sans">
    <div class="max-w-2xl mx-auto p-4 py-10">
        <!-- 標題區塊 -->
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-teal-600 mb-2">單元一：常見藥用植物科名</h1>
            <p class="text-gray-500">幫助你記憶英文單詞與對應中文</p>
        </div>

        <!-- 頁籤切換 -->
        <div class="flex justify-center mb-6 space-x-2">
            <button id="tab-choice" class="px-6 py-2 bg-teal-500 text-white rounded-lg font-semibold shadow hover:bg-teal-600 transition" onclick="switchTab('choice')">選擇題</button>
            <button id="tab-fill" class="px-6 py-2 bg-gray-200 text-gray-600 rounded-lg font-semibold shadow hover:bg-gray-300 transition" onclick="switchTab('fill')">填充題</button>
        </div>

        <!-- 選擇題區塊 -->
        <div id="choice-section" class="bg-white rounded-xl shadow-lg p-6 fade-in">
            <div class="text-center mb-6">
                <span class="text-sm font-bold text-gray-400 uppercase tracking-wider">選擇題</span>
                <h2 id="choice-question" class="text-2xl font-bold mt-2 min-h-[4rem] flex items-center justify-center">載入中...</h2>
            </div>
            
            <div id="choice-options" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <!-- 選項按鈕會透過 JS 生成 -->
            </div>

            <div id="choice-feedback" class="mt-6 text-center hidden">
                <p id="choice-result-text" class="text-lg font-bold mb-4"></p>
                <button onclick="generateChoiceQuestion()" class="px-6 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition shadow">下一題</button>
            </div>
        </div>

        <!-- 填充題區塊 -->
        <div id="fill-section" class="bg-white rounded-xl shadow-lg p-6 fade-in hidden">
            <div class="text-center mb-6">
                <span class="text-sm font-bold text-gray-400 uppercase tracking-wider">填充題</span>
                <h2 id="fill-question" class="text-2xl font-bold mt-2 min-h-[4rem] flex items-center justify-center">載入中...</h2>
            </div>

            <div class="flex flex-col items-center gap-4">
                <input type="text" id="fill-input" placeholder="請輸入對應的答案..." class="w-full max-w-md px-4 py-2 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-teal-500 transition text-center text-lg">
                <button id="fill-submit" onclick="checkFillAnswer()" class="px-6 py-2 bg-teal-500 text-white rounded-lg hover:bg-teal-600 transition shadow w-full max-w-md font-bold">送出答案</button>
            </div>

            <div id="fill-feedback" class="mt-6 text-center hidden flex-col items-center gap-4">
                <p id="fill-result-text" class="text-lg font-bold"></p>
                <div id="fill-correct-answer" class="text-gray-700 bg-gray-100 px-4 py-2 rounded-lg w-full max-w-md"></div>
                <button onclick="generateFillQuestion()" class="px-6 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition shadow">下一題</button>
            </div>
        </div>
    </div>

        // 題庫資料

            { zh: '茄科', en: ['Solanaceae'] },
            { zh: '紫葳科', en: ['Bignoniaceae'] },
            { zh: '十字花科', en: ['Brassicaceae', 'Cruciferae'] },

            { zh: '芸香科', en: ['Rutaceae'] },
            { zh: '大戟科', en: ['Euphorbiaceae'] }
        ];

        let currentChoiceQuestion = null;

        // 切換頁籤
        function switchTab(tab) {

            const choiceSec = document.getElementById('choice-section');
            const fillSec = document.getElementById('fill-section');

            if (tab === 'choice') {
                choiceBtn.classList.replace('bg-gray-200', 'bg-teal-500');
                choiceBtn.classList.replace('text-gray-600', 'text-white');
                fillBtn.classList.replace('bg-teal-500', 'bg-gray-200');
                fillBtn.classList.replace('text-white', 'text-gray-600');
                choiceSec.classList.remove('hidden');
                fillSec.classList.add('hidden');
            } else {
                fillBtn.classList.replace('bg-gray-200', 'bg-teal-500');
                fillBtn.classList.replace('text-gray-600', 'text-white');
                choiceBtn.
                    
        // 監聽 Enter 鍵送出填充題
        document.getElementById('fill-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter' && !this.disabled) {
                checkFillAnswer();
            }
        });

        // 初始化
        generateChoiceQuestion();
        generateFillQuestion();
    </script>
</body>
</html>
