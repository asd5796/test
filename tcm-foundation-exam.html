          qSection.textContent = '🟢 基本題 (考古直出短題幹)';
          qSection.className = 'section-pill section-basic';
        } else {
          qSection.textContent = '🟡 進階題 (深度概念辨析)';
          qSection.className = 'section-pill section-advanced';
        }

        // Header
        qChapter.textContent = q.chapter;
        qNum.textContent = `第 ${currentIndex + 1} 題 / 共 ${activeQuestions.length} 題 (全庫 #${q.id})`;
        
        if (q.isExamStar) {
          qExamStar.style.display = 'inline-block';
        } else {
          qExamStar.style.display = 'none';
        }

        // Bookmark
        if (qBookmark) {
          if (bookmarkIds.has(q.id)) qBookmark.classList.add('active');
          else qBookmark.classList.remove('active');
        }

        // Stem
        qStem.textContent = q.question;

        // Progress bar
        const pct = Math.round(((currentIndex + 1) / activeQuestions.length) * 100);
        pBar.style.width = `${pct}%`;
        pText.textContent = `${currentIndex + 1} / ${activeQuestions.length} (${pct}%)`;

        // Nav buttons
        prevBtn.disabled = (currentIndex === 0);
        nextBtn.disabled = (currentIndex === activeQuestions.length - 1);

        // True / False Options
        optsList.innerHTML = '';
        const letters = ['A', 'B'];
        const tfLabels = ['○ 正確 (True)', '╳ 錯誤 (False)'];
        const tfSymbols = ['○', '╳'];
        const tfClasses = ['tf-symbol-true', 'tf-symbol-false'];

        q.options.forEach((optText, optIdx) => {
          const btn = document.createElement('button');
          btn.className = 'option-btn';
          btn.disabled = isAnswered;

          const prefixSpan = document.createElement('span');
          prefixSpan.className = 'option-prefix';
          prefixSpan.textContent = letters[optIdx];

          const symbolSpan = document.createElement('span');
          symbolSpan.className = `tf-symbol ${tfClasses[optIdx]}`;
          symbolSpan.textContent = tfSymbols[optIdx];

          const textSpan = document.createElement('span');
          textSpan.textContent = tfLabels[optIdx];

          btn.appendChild(prefixSpan);
          btn.appendChild(symbolSpan);
          btn.appendChild(textSpan);

          if (isAnswered) {
            if (optIdx === q.answer) {
              btn.classList.add('correct');
            } else if (optIdx === userChoice) {
              btn.classList.add('wrong');
            }
          } else {
            btn.onclick = () => selectOption(optIdx);
          }

          optsList.appendChild(btn);
        });

        // Explanation Box
        if (isAnswered) {
          expBox.classList.add('active');
          if (userChoice === q.answer) {
            resBadge.textContent = '答對！ 🎉';
            resBadge.style.color = 'var(--success)';
          } else {
            resBadge.textContent = '答錯了！ 💡';
            resBadge.style.color = 'var(--error)';
          }
          srcBadge.textContent = q.source || '中醫概論核心考點';
          expText.textContent = q.explanation;
        } else {
          expBox.classList.remove('active');
        }

        updateStats();
      }

      function selectOption(idx) {
        const q = activeQuestions[currentIndex];
        userAnswers[q.id] = idx;

        if (idx === q.answer) {
          wrongIds.delete(q.id);
        } else {
          wrongIds.add(q.id);
        }

        saveStorage();
        renderQuestion();
        renderGrid();
      }

      window.toggleBookmark = function() {
        if (!activeQuestions[currentIndex]) return;
        const qid = activeQuestions[currentIndex].id;
        if (bookmarkIds.has(qid)) {
          bookmarkIds.delete(qid);
          showToast('已取消收藏');
        } else {
          bookmarkIds.add(qid);
          showToast('⭐ 已加入收藏題庫！');
        }
        saveStorage();
        renderQuestion();
        renderGrid();
      };

      window.nextQuestion = function() {
        if (currentIndex < activeQuestions.length - 1) {
          currentIndex++;
          renderQuestion();
          renderGrid();
        }
      };

      window.prevQuestion = function() {
        if (currentIndex > 0) {
          currentIndex--;
          renderQuestion();
          renderGrid();
        }
      };

      function renderGrid() {
        gridContainer.innerHTML = '';
        activeQuestions.forEach((q, idx) => {
          const btn = document.createElement('button');
          btn.className = 'grid-btn';
          btn.textContent = q.id;

          if (idx === currentIndex) {
            btn.classList.add('current');
          }

          if (userAnswers[q.id] !== undefined) {
            if (userAnswers[q.id] === q.answer) {
              btn.classList.add('correct');
            } else {
              btn.classList.add('wrong');
            }
          }

          if (bookmarkIds.has(q.id)) {
            btn.classList.add('bookmarked');
          }

          btn.onclick = () => {
            currentIndex = idx;
            renderQuestion();
            renderGrid();
          };

          gridContainer.appendChild(btn);
        });
      }

      // === DARK MODE & GOOGLE FORM REPORT LOGIC ===
      const THEME_STORAGE_KEY = 'tajen_quiz_theme';
      const GOOGLE_FORM_ACTION = 'https://docs.google.com/forms/d/e/1FAIpQLSeeuhUtsdux9m3EgCDKocSfZMrF254vzmG_8Vj76-wUs91X7w/formResponse';
      const GOOGLE_FORM_VIEW = 'https://docs.google.com/forms/d/e/1FAIpQLSeeuhUtsdux9m3EgCDKocSfZMrF254vzmG_8Vj76-wUs91X7w/viewform';
      const ENTRY_INFO = 'entry.988229156';
      const ENTRY_TYPE = 'entry.1380588807';
      const ENTRY_DESC = 'entry.1539958000';

      function applyTheme(isDark) {
        if (isDark) {
          document.body.classList.add('dark-mode');
        } else {
          document.body.classList.remove('dark-mode');
        }
        const iconEl = document.getElementById('themeIcon');
        const textEl = document.getElementById('themeText');
        if (iconEl) iconEl.textContent = isDark ? '☀️' : '🌙';
        if (textEl) textEl.textContent = isDark ? '淺色' : '深色';
      }

      window.toggleTheme = function() {
        const isDark = !document.body.classList.contains('dark-mode');
        applyTheme(isDark);
        try {
          localStorage.setItem(THEME_STORAGE_KEY, isDark ? 'dark' : 'light');
        } catch(e) {}
        showToast(isDark ? '🌙 已切換至深色護眼模式' : '☀️ 已切換至淺色模式');
      };

      // Initialize theme immediately
      try {
        const savedTheme = localStorage.getItem(THEME_STORAGE_KEY);
        if (savedTheme === 'dark') {
          applyTheme(true);
        }
      } catch(e) {}

      function getQuestionReportInfo() {
        if (!activeQuestions || !activeQuestions.length) return '';
        const q = activeQuestions[currentIndex];
        if (!q) return '';
        const rawTitle = (document.title || '測驗題庫').split(' ')[0];
        const cat = q.chapter || q.category || '';
        const src = q.source ? ` | 出處: ${q.source}` : '';
        if (q.options && q.options.length === 2 && (q.options[0].includes('○') || q.options[0].includes('正確'))) {
          const ansText = q.answer === 0 ? '○ 正確 (True)' : '╳ 錯誤 (False)';
          return `【${rawTitle}】題號 #${q.id} (${cat})\n題幹: ${q.question}\n目前正解: ${ansText}${src}`;
        } else {
          const letters = ['A', 'B', 'C', 'D'];
          const opts = (q.options || []).map((o, i) => `${letters[i]}.${o.replace(/^[A-D]\.\s*/, '')}`).join(' ');
          return `【${rawTitle}】題號 #${q.id} (${cat})\n題目: ${q.question}\n選項: ${opts}\n目前正解: ${letters[q.answer]}${src}`;
        }
      }

      window.openReportModal = function() {
        const modal = document.getElementById('reportModalOverlay');
        const preview = document.getElementById('reportInfoPreview');
        const desc = document.getElementById('reportDescInput');
        const submitBtn = document.getElementById('reportSubmitBtn');
        const submitText = document.getElementById('reportSubmitText');
        if (!modal) return;
        if (preview) preview.value = getQuestionReportInfo();
        if (desc) desc.value = '';
        const r1 = document.getElementById('issueType1');
        if (r1) r1.checked = true;
        if (submitBtn) submitBtn.disabled = false;
        if (submitText) submitText.textContent = '直接送出回報';
        modal.classList.add('active');
      };

      window.closeReportModal = function() {
        const modal = document.getElementById('reportModalOverlay');
        if (modal) modal.classList.remove('active');
      };

      window.openPrefilledGoogleForm = function() {
        const info = getQuestionReportInfo();
        const checkedRadio = document.querySelector('input[name="reportIssueType"]:checked');
        const issueType = checkedRadio ? checkedRadio.value : '答案錯誤';
        const desc = (document.getElementById('reportDescInput') || {}).value || '';
        const params = new URLSearchParams();
        params.append('usp', 'pp_url');
        params.append(ENTRY_INFO, info);
        params.append(ENTRY_TYPE, issueType);
        if (desc.trim()) params.append(ENTRY_DESC, desc.trim());
        window.open(`${GOOGLE_FORM_VIEW}?${params.toString()}`, '_blank', 'noopener');
      };

      window.submitQuestionReport = function() {
        const info = getQuestionReportInfo();
        const checkedRadio = document.querySelector('input[name="reportIssueType"]:checked');
        const issueType = checkedRadio ? checkedRadio.value : '答案錯誤';
        const desc = ((document.getElementById('reportDescInput') || {}).value || '').trim();
        const submitBtn = document.getElementById('reportSubmitBtn');
        const submitText = document.getElementById('reportSubmitText');

        if (submitBtn) submitBtn.disabled = true;
        if (submitText) submitText.textContent = '傳送中...';

        const params = new URLSearchParams();
        params.append(ENTRY_INFO, info);
        params.append(ENTRY_TYPE, issueType);
        params.append(ENTRY_DESC, desc);
        params.append('fvv', '1');
        params.append('pageHistory', '0');

        fetch(GOOGLE_FORM_ACTION, {
          method: 'POST',
          mode: 'no-cors',
          headers: {
            'Content-Type': 'application/x-www-form-urlencoded'
          },
          body: params.toString()
        }).then(() => {
          closeReportModal();
          showToast('✅ 問題回報已成功送出！感謝您的協助！');
        }).catch(() => {
          if (submitBtn) submitBtn.disabled = false;
          if (submitText) submitText.textContent = '直接送出回報';
          if (confirm('網路連線受阻，是否改為開啟預填好的 Google 表單頁面送出？')) {
            openPrefilledGoogleForm();
            closeReportModal();
          }
        });
      };

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          closeReportModal();
        }
      });
      // === END DARK MODE & GOOGLE FORM REPORT LOGIC ===

      window.copyQuestionReport = function() {
        const q = activeQuestions[currentIndex];
        const ansText = q.answer === 0 ? '○ 正確 (True)' : '╳ 錯誤 (False)';
        const userChoiceText = userAnswers[q.id] !== undefined ? (userAnswers[q.id] === 0 ? '○ 正確' : '╳ 錯誤') : '未作答';
        const secText = q.section === 'basic' ? '基本題型 (考古直出)' : '進階題型 (深度辨析)';
        const text = `【中醫概論是非題題目勘誤回報】
題號: #${q.id}
類型: ${secText}
單元: ${q.chapter}
出處: ${q.source}
題幹陳述: ${q.question}
考生作答: ${userChoiceText}
標準正解: ${ansText}
考點解析: ${q.explanation}

建議修改或補充:
`;
        navigator.clipboard.writeText(text).then(() => {
          showToast('📋 已複製題目回報格式至剪貼簿！');
        }).catch(() => {
          alert('複製失敗，請手動複製。');
        });
      }

      function showToast(msg) {
        if (!toast) return;
        toast.textContent = msg;
        toast.style.display = 'block';
        setTimeout(() => {
          toast.style.display = 'none';
        }, 2000);
      }

      // Keyboard navigation
      document.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || (document.getElementById('reportModalOverlay') && document.getElementById('reportModalOverlay').classList.contains('active'))) return;
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
        if (e.key === 'ArrowRight' || e.key === 'PageDown') {
          nextQuestion();
        } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
          prevQuestion();
        } else if (['1', 'a', 'A', 'o', 'O', 't', 'T'].includes(e.key)) {
          const q = activeQuestions[currentIndex];
          if (q && userAnswers[q.id] === undefined) {
            selectOption(0);
          }
        } else if (['2', 'b', 'B', 'x', 'X', 'f', 'F'].includes(e.key)) {
          const q = activeQuestions[currentIndex];
          if (q && userAnswers[q.id] === undefined) {
            selectOption(1);
          }
        }
      });

      // Init
      window.addEventListener('DOMContentLoaded', () => {
        allQuestions = window.QUIZ_DATA || [];
        activeQuestions = [...allQuestions];
        loadStorage();
        updateShuffleUI();
        if (isShuffle) {
          shuffleArray(activeQuestions);
        }
        renderQuestion();
        renderGrid();
      });
    })();
  </script>
</body>
</html>
